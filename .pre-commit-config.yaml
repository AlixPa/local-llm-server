repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(openai-spec/|apps/web/(src/api/schema\.d\.ts|src/components/ui/|pnpm-lock\.yaml))
      - id: end-of-file-fixer
        exclude: ^(openai-spec/|apps/web/(src/api/schema\.d\.ts|src/components/ui/|pnpm-lock\.yaml))
      - id: check-yaml
        exclude: ^openai-spec/
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=5000]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        exclude: ^packages/db/alembic/
      - id: biome
        name: biome
        entry: bash -c 'cd apps/web && pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true "${@#apps/web/}"' --
        language: system
        files: ^apps/web/
        exclude: ^apps/web/(src/api/schema\.d\.ts|src/components/ui/|pnpm-lock\.yaml)
      - id: tsc
        name: tsc
        entry: pnpm --dir apps/web typecheck
        language: system
        files: ^apps/web/.*\.(ts|tsx|json)$
        exclude: ^apps/web/(pnpm-lock\.yaml|biome\.json)
        pass_filenames: false
